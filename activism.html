<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Activism — Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: 'Neuton', serif;
    }

    .container {
      width: 100%;
    }

    .hero {
      background: var(--blue);
      color: var(--black);
      padding: 48px 40px 80px;
    }

    h1 {
      font-size: 42px;
      margin: 0;
      font-weight: 800;
      line-height: 1;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 42px;
    }

    .links a {
      color: var(--black);
      border: 1.5px solid var(--black);
      border-radius: 999px;
      padding: 10px 22px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
    }

    main {
      background: var(--black);
      padding: 100px 40px;
    }

    .text {
      max-width: 980px;
      font-size: 28px;
      line-height: 1.35;
      font-weight: 700;
      color: var(--white);
    }

    footer {
      background: var(--blue);
      color: var(--black);
      padding: 36px 40px;
      font-size: 18px;
      font-weight: 800;
    }

    @media (max-width: 900px) {

      .hero {
        padding: 40px 24px 64px;
      }

      main {
        padding: 70px 24px;
      }

      h1 {
        font-size: 36px;
      }

      .links a {
        font-size: 16px;
        padding: 10px 18px;
      }

      .text {
        font-size: 22px;
      }

      footer {
        padding: 28px 24px;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <header class="hero">

      <h1>Activism</h1>

      <div class="links">

        <a href="index.html">Home</a>

        <a href="dj.html">DJ</a>

        <a href="events.html">Events</a>

        <a href="contact.html">Contact</a>

      </div>

    </header>

    <main>

      <div class="text">
        Nature advocate focusing on lobbying at Greenpeace, member of the anti-hierarchical and anti-transactional communal space Cosy Club, and currently co-founding a new activist collective centered around the ideology of Planetary Care.
      </div>

    </main>

    <footer>
      Carlina Carpelan
    </footer>

  </div>

</body>

</html>
