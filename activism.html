<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Activism — Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Neuton:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: 'Neuton', serif;
      line-height: 1.7;
    }

    .container {
      max-width: 900px;
      margin: auto;
      min-height: 100vh;
    }

    .hero {
      background: var(--blue);
      color: var(--black);
      padding: 80px 24px;
    }

    h1 {
      font-size: 72px;
      margin: 0 0 50px;
      font-weight: 800;
      line-height: 1;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .links a {
      color: var(--black);
      border: 1.5px solid var(--black);
      border-radius: 999px;
      padding: 10px 22px;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .links a:hover {
      background: var(--black);
      color: var(--blue);
      transform: translateY(-2px);
    }

    main {
      padding: 80px 24px;
    }

    p {
      font-size: 22px;
      color: #d0d0d0;
      margin: 0;
    }

    footer {
      margin-top: 60px;
      background: var(--blue);
      color: var(--black);
      padding: 24px;
      font-size: 20px;
      font-weight: 700;
    }

    @media (max-width: 768px) {

      .hero {
        padding: 60px 24px;
      }

      h1 {
        font-size: 48px;
      }

      .links a {
        font-size: 18px;
      }

      p {
        font-size: 20px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <h1>
        Activism
      </h1>

      <div class="links">

        <a href="index.html">
          Home
        </a>

        <a href="dj.html">
          DJ
        </a>

        <a href="events.html">
          Events
        </a>

        <a href="contact.html">
          Contact
        </a>

      </div>

    </header>

    <main>

      <p>
        Nature advocate focusing on lobbying at Greenpeace, member of the anti-hierarchical and anti-transactional communal space Cosy Club, currently co-founding a new activist collective centered around the ideology of Planetary Care.
      </p>

    </main>

    <footer>
      Carlina Carpelan
    </footer>

  </div>

</body>

</html>
