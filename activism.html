<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Activism — Carlina Carpelan</title>

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background: var(--blue);
      color: var(--black);
      display: flex;
      align-items: center;
    }

    .hero-text {
      padding: 48px 40px;
      width: 100%;
    }

    h1 {
      font-size: clamp(82px, 13vw, 190px);
      line-height: 0.82;
      margin: 0;
      font-weight: 900;
      letter-spacing: -0.08em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 42px;
      margin-bottom: 56px;
    }

    .links a {
      color: var(--black);
      border: 1.5px solid var(--black);
      border-radius: 999px;
      padding: 10px 22px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .links a:hover {
      background: var(--black);
      color: var(--blue);
      transform: translateY(-2px);
    }

    .intro {
      max-width: 900px;
      font-size: 22px;
      line-height: 1.45;
      margin: 0;
      font-weight: 400;
    }

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .hero {
        min-height: 100vh;
        height: auto;
      }

      .hero-text {
        padding: 40px 24px;
      }

      h1 {
        font-size: clamp(64px, 18vw, 120px);
      }

      .links {
        gap: 12px;
        margin-bottom: 44px;
      }

      .links a {
        font-size: 16px;
        padding: 10px 18px;
      }

      .intro {
        font-size: 20px;
      }
    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <h1>
          Activism
        </h1>

        <div class="links">

          <a href="index.html">
            Home
          </a>

          <a href="dj.html">
            DJ
          </a>

          <a href="events.html">
            Events
          </a>

          <a href="contact.html">
            Contact
          </a>

        </div>

        <p class="intro">
          Nature advocate focusing on lobbying at Greenpeace, member of the anti-hierarchical and anti-transactional communal space Cosy Club, and currently co-founding a new activist collective centered around the ideology of Planetary Care.
        </p>

      </div>

    </header>

  </div>

</body>

</html>
