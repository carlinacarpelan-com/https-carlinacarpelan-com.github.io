<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activism</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Neuton:wght@300;400;700&display=swap" rel="stylesheet">

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

/* BODY */
body{
  background:#000;
  color:#f5f5f5;
  font-family:'Neuton', serif;
}

/* TOP SECTION */
.hero{
  width:85%;
  margin:60px auto;
  background:#c8d8df;
  padding:70px;
}

/* TITLE */
.hero h1{
  font-family:Georgia, serif;
  font-size:5rem;
  font-weight:700;
  color:#000;
  margin-bottom:55px;
  line-height:0.9;
  letter-spacing:-0.04em;
}

/* NAV */
nav{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

nav a{
  font-family:Georgia, serif;
  text-decoration:none;
  color:#000;
  border:2px solid #000;
  border-radius:999px;
  padding:14px 30px;
  font-size:1.2rem;
  transition:0.2s ease;
}

/* HOVER */
nav a:hover{
  background:#000;
  color:#fff;
}

/* CONTENT */
.content{
  width:70%;
  margin:110px auto;
}

/* TEXT */
.content p{
  font-family:'Neuton', serif;
  font-size:2rem;
  line-height:1.8;
  color:#f0f0f0;
}

/* MOBILE */
@media(max-width:768px){

  .hero{
    width:92%;
    padding:40px;
  }

  .hero h1{
    font-size:3rem;
  }

  nav{
    gap:12px;
  }

  nav a{
    font-size:1rem;
    padding:12px 22px;
  }

  .content{
    width:88%;
  }

  .content p{
    font-size:1.3rem;
  }
}

</style>
</head>

<body>

<section class="hero">

  <h1>Activism</h1>

  <nav>
    <a href="#">Home</a>
    <a href="#">DJ</a>
    <a href="#">Events</a>
    <a href="#">Contact</a>
  </nav>

</section>

<section class="content">

<p>
Nature advocate focusing on lobbying at Greenpeace, member of the anti-hierarchical and anti-transactional communal space Cosy Club, currently co-founding a new activist collective centered around the ideology of Planetary Care.
</p>

</section>

</body>
</html>
