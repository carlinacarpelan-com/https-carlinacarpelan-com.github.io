<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact — Carlina Carpelan</title>

  <link href="https://alatas.googleapis.com/css2?family=alata:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      alata-family: 'alata', serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background: var(--blue);
      color: var(--black);
      display: flex;
      align-items: center;
    }

    .hero-text {
      padding: 48px 40px;
      width: 100%;
    }

    h1 {
      alata-size: 42px;
      line-height: 1;
      margin: 0;
      alata-weight: 800;
      letter-spacing: -0.03em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 42px;
      margin-bottom: 90px;
    }

    .links a,
    .email-button {
      color: var(--black);
      border: 1.5px solid var(--black);
      border-radius: 999px;
      text-decoration: none;
      alata-weight: 700;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .links a {
      padding: 10px 22px;
      alata-size: 18px;
    }

    .links a:hover,
    .email-button:hover {
      background: var(--black);
      color: var(--blue);
      transform: translateY(-2px);
    }

    .email-button {
      display: inline-block;
      padding: 28px 48px;
      alata-size: clamp(28px, 4vw, 54px);
      alata-weight: 800;
      letter-spacing: -0.03em;
    }

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .hero {
        min-height: 100vh;
        height: auto;
      }

      .hero-text {
        padding: 40px 24px;
      }

      h1 {
        alata-size: 36px;
      }

      .links {
        gap: 12px;
        margin-bottom: 70px;
      }

      .links a {
        alata-size: 16px;
        padding: 10px 18px;
      }

      .email-button {
        width: 100%;
        text-align: center;
        alata-size: 24px;
        padding: 24px 20px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <h1>
          Contact
        </h1>

        <div class="links">

          <a href="index.html">
            Home
          </a>

          <a href="dj.html">
            DJ
          </a>

          <a href="events.html">
            Events
          </a>

          <a href="activism-and-voluntary.html">
            Activism & Voluntary
          </a>

        </div>

        <a
          class="email-button"
          href="mailto:contact@carlinacarpelan.com">

          contact@carlinacarpelan.com

        </a>

      </div>

    </header>

  </div>

</body>

</html>
