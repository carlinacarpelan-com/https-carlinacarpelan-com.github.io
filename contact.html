<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact — Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --cream: #F3EFE6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      font-family: 'Alata', sans-serif;
      overflow-x: hidden;
      color: var(--black);
    }

    .container {
      width: 100%;
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      min-height: 56vh;
      display: flex;
    }

    /* LEFT SIDE */

    .hero-left {
      width: 72%;
      background: var(--blue);
      position: relative;
      min-height: 56vh;
      overflow: visible;
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 42%;
      transform: translateY(-50%);
      width: 430px;
      max-width: calc(100% - 140px);
      z-index: 2;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* SPIRAL MENU */

    .menu {
      position: absolute;
      left: 92px;
      top: calc(42% + 10px);
      width: 320px;
      height: 320px;
      z-index: 9999;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      transition: transform 0.6s ease;
    }

    .menu-button:hover img {
      transform: rotate(360deg);
    }

    .dropdown {
      position: absolute;
      top: 58px;
      left: 0;
      width: 300px;
      background: var(--black);
      border-radius: 22px;
      display: none;
      overflow: hidden;
      padding: 8px 0 16px;
      box-shadow: 0 14px 45px rgba(0,0,0,0.3);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown {
      display: block;
    }

    /* RIGHT SIDE */

    .hero-right {
      width: 28%;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .contact-title {
      width: 220px;
      max-width: 100%;
    }

    .contact-title img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* CONTENT */

    .content {
      background: var(--black);
      padding:
        32px
        40px
        80px;
    }

    .email-button {
      display: inline-block;
      color: var(--blue);
      border: 1.5px solid var(--blue);
      border-radius: 999px;
      text-decoration: none;
      padding: 24px 42px;
      font-size: clamp(24px, 3vw, 44px);
      letter-spacing: -0.03em;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .email-button:hover {
      background: var(--blue);
      color: var(--black);
      transform: translateY(-2px);
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .hero {
        flex-direction: column;
        min-height: auto;
      }

      .hero-left {
        width: 100%;
        min-height: 18vh;
        padding:
          26px
          22px
          10px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        position: static;
        transform: none;
        width: 260px;
        max-width: 72vw;
      }

      .menu {
        position: relative;
        left: auto;
        top: auto;
        width: 58px;
        height: 58px;
      }

      .menu-button {
        width: 58px;
        height: 58px;
      }

      .menu-button img {
        width: 48px;
        height: 48px;
      }

      .dropdown {
        width: 248px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 14px 18px;
      }

      .hero-right {
        width: 100%;
        padding: 26px 22px;
      }

      .contact-title {
        width: 180px;
      }

      .content {
        padding:
          24px
          22px
          60px;
      }

      .email-button {
        width: 100%;
        text-align: center;
        font-size: 22px;
        padding: 20px 18px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-left">

        <div class="mobile-brand">

          <nav class="menu">

            <button class="menu-button" type="button">
              <img src="spiral.png" alt="Menu">
            </button>

            <div class="dropdown">

              <a href="index.html">
                Home
              </a>

              <a href="dj.html">
                DJ
              </a>

              <a href="events.html">
                Events
              </a>

              <a href="activism-and-voluntary.html">
                Activism & Voluntary
              </a>

              <a href="contact.html">
                Contact
              </a>

            </div>

          </nav>

          <div class="logo">
            <img src="handwritten.png" alt="Carlina Carpelan">
          </div>

        </div>

      </div>

      <div class="hero-right">

        <div class="contact-title">
          <img src="contact.png" alt="Contact">
        </div>

      </div>

    </header>

    <main class="content">

      <a
        class="email-button"
        href="mailto:contact@carlinacarpelan.com">

        contact@carlinacarpelan.com

      </a>

    </main>

  </div>

</body>

</html>
