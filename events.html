<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Events — Carlina Carpelan</title>

  <style>

    :root {
      --black: #000000;
      --blue: #00a6ff;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.2;
    }

    .container {
      width: 100%;
    }

    .hero {
      background: var(--blue);
      color: var(--black);
      padding: 48px 40px 80px;
    }

    h1 {
      font-size: clamp(82px, 13vw, 190px);
      line-height: 0.82;
      margin: 0;
      font-weight: 900;
      letter-spacing: -0.08em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 42px;
    }

    .links a {
      color: var(--black);
      border: 1.5px solid var(--black);
      border-radius: 999px;
      padding: 10px 22px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .links a:hover {
      background: var(--black);
      color: var(--blue);
      transform: translateY(-2px);
    }

    .events {
      padding: 90px 40px;
      background: var(--black);
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .event-card {
      border: 2px solid var(--white);
      padding: 24px;
      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .event-card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.03);
    }

    .event-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 2px solid var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      font-size: 18px;
      font-weight: 700;
      opacity: 0.7;
      overflow: hidden;
    }

    .event-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h2 {
      font-size: 42px;
      margin: 0 0 18px;
      letter-spacing: -0.05em;
      font-weight: 900;
    }

    p {
      font-size: 22px;
      line-height: 1.45;
      margin: 0;
      opacity: 0.82;
    }

    footer {
      background: var(--blue);
      color: var(--black);
      padding: 36px 40px;
      font-size: 18px;
      font-weight: 800;
    }

    @media (max-width: 900px) {

      .hero {
        padding: 40px 24px 64px;
      }

      .events {
        padding: 70px 24px;
      }

      h1 {
        font-size: clamp(64px, 18vw, 120px);
      }

      .event-grid {
        grid-template-columns: 1fr;
      }

      .links {
        gap: 12px;
      }

      .links a {
        font-size: 16px;
        padding: 10px 18px;
      }

      h2 {
        font-size: 32px;
      }

      p {
        font-size: 20px;
      }

    }

  </style>

</head>
