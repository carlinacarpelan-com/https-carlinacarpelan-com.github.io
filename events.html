<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Events — Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --cream: #F3EFE6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      font-family: 'Alata', sans-serif;
      overflow-x: hidden;
      color: var(--white);
    }

    .container {
      width: 100%;
      min-height: 100vh;
    }

    /* HEADER */

    .hero {
      width: 100%;
      min-height: 38vh;
      display: flex;
    }

    /* LEFT SIDE */

    .hero-left {
      width: 34%;
      background: var(--blue);
      position: relative;
      min-height: 38vh;
      overflow: visible;
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 42%;
      transform: translateY(-50%);
      width: 390px;
      max-width: calc(100% - 120px);
      z-index: 2;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* MENU */

    .menu {
      position: absolute;
      left: 92px;
      top: calc(42% + 4px);
      width: 320px;
      height: 220px;
      z-index: 9999;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      transition: transform 0.6s ease;
    }

    .menu-button:hover img {
      transform: rotate(360deg);
    }

    .dropdown {
      position: absolute;
      top: 58px;
      left: 0;
      width: 300px;
      background: var(--black);
      border-radius: 22px;
      display: none;
      overflow: hidden;
      padding: 8px 0 16px;
      box-shadow: 0 14px 45px rgba(0,0,0,0.3);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown {
      display: block;
    }

    /* RIGHT SIDE */

    .hero-right {
      width: 66%;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 70px;
    }

    .events-title img {
      width: 240px;
      max-width: 100%;
      display: block;
      height: auto;
      background: transparent;
    }

    /* EVENTS */

    .events {
      padding:
        36px
        40px
        90px;
      background: var(--black);
    }

    .event-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
    }

    .event-card {
      border: 2px solid var(--white);
      padding: 24px;
      transition:
        transform 0.25s ease,
        background 0.25s ease;
    }

    .event-card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.03);
    }

    .event-image {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 2px solid var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
      font-size: 18px;
      opacity: 0.7;
      overflow: hidden;
    }

    .event-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    h2 {
      font-size: 42px;
      margin: 0 0 18px;
      letter-spacing: -0.03em;
      line-height: 1;
      font-weight: 400;
    }

    p {
      font-size: 22px;
      line-height: 1.45;
      margin: 0;
      opacity: 0.82;
    }

    footer {
      background: var(--blue);
      color: var(--black);
      padding: 36px 40px;
      font-size: 18px;
    }

    /* MOBILE */

    @media (max-width: 900px) {

      .hero {
        flex-direction: column;
        min-height: auto;
      }

      .hero-left {
        width: 100%;
        min-height: 16vh;
        padding:
          22px
          22px
          6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logo {
        position: static;
        transform: none;
        width: 250px;
        max-width: 70vw;
      }

      .menu {
        position: relative;
        left: auto;
        top: auto;
        width: 58px;
        height: 58px;
      }

      .menu-button {
        width: 58px;
        height: 58px;
      }

      .menu-button img {
        width: 48px;
        height: 48px;
      }

      .dropdown {
        width: 248px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 14px 18px;
      }

      .hero-right {
        width: 100%;
        padding: 18px 22px;
        justify-content: center;
      }

      .events-title img {
        width: 170px;
      }

      .events {
        padding:
          26px
          22px
          70px;
      }

      .event-grid {
        grid-template-columns: 1fr;
      }

      h2 {
        font-size: 32px;
      }

      p {
        font-size: 20px;
      }

      footer {
        padding: 28px 24px;
      }

    }

  </style>

</head>
