<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>DJ — Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --cream: #F3EFE6;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      font-family: 'Alata', sans-serif;
      overflow-x: hidden;
      color: var(--white);
      line-height: 1.2;
    }

    .container {
      width: 100%;
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      min-height: 38vh;
      display: flex;
    }

    .hero-left {
      width: 34%;
      background: var(--blue);
      position: relative;
      min-height: 38vh;
      overflow: visible;
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 42%;
      transform: translateY(-50%);
      width: 390px;
      max-width: calc(100% - 120px);
      z-index: 2;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      display: block;
      height: auto;
    }

    .menu {
      position: absolute;
      left: 92px;
      top: calc(42% + 4px);
      width: 320px;
      height: 260px;
      z-index: 9999;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      transition: transform .6s ease;
    }

    .menu-button:hover img {
      transform: rotate(360deg);
    }

    .dropdown {
      position: absolute;
      top: 58px;
      left: 0;
      width: 300px;
      background: var(--black);
      border-radius: 22px;
      display: none;
      overflow: hidden;
      padding: 8px 0 16px;
      box-shadow: 0 14px 45px rgba(0,0,0,.3);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown {
      display: block;
    }

    .hero-right {
      width: 66%;
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 30px 70px;
    }

    .dj-title img {
      width: 150px;
      max-width: 100%;
      display: block;
      height: auto;
    }

    section {
      padding: 70px 40px;
    }

    section:nth-of-type(even) {
      background: var(--cream);
      color: var(--black);
    }

    h2 {
      font-size: clamp(42px,6vw,82px);
      line-height: .92;
      margin: 0 0 42px;
      letter-spacing: -.05em;
      font-weight: 400;
    }

    p {
      font-size: 22px;
      max-width: 900px;
      margin: 0 0 22px;
      line-height: 1.45;
      color: rgba(255,255,255,.82);
    }

    section:nth-of-type(even) p {
      color: rgba(0,0,0,.82);
    }

    .bio {
      max-width: 940px;
    }

    .about-buttons{
      margin-top:40px;
    }

    .page-button{
      display:inline-block;
      padding:12px 24px;
      border:2px solid var(--blue);
      border-radius:999px;
      color:var(--blue);
      text-decoration:none;
      font-size:20px;
      transition:.2s;
    }

    .page-button:hover{
      background:var(--blue);
      color:var(--black);
    }

    .photo-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:28px;
    }

    .photo-grid img {
      width:100%;
      height:620px;
      object-fit:cover;
      display:block;
      transition:transform .35s ease;
    }

    .photo-grid img:hover {
      transform:scale(1.015);
    }

    .soundcloud iframe,
    .video-grid iframe{
      width:100%;
      border:0;
    }

    .soundcloud iframe{
      margin-bottom:28px;
    }

    .video-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:28px;
    }

    .video-grid iframe{
      aspect-ratio:16/9;
    }

    .booking-box{
      max-width:760px;
    }

    .booking-box p{
      font-size:22px;
      margin-bottom:16px;
    }

    .booking-email{
      display:inline-block;
      color:inherit;
      text-decoration:none;
      font-size:30px;
      border-bottom:3px solid currentColor;
      margin-bottom:40px;
      transition:opacity .2s ease;
    }

    .booking-email:hover{
      opacity:.65;
    }

    footer{
      padding:36px 40px;
      background:var(--blue);
      color:var(--black);
      font-size:18px;
    }

        <section id="about">

      <h2>About</h2>

      <div class="bio">

        <p>
          Snappy snares? You got it. Bad-to-the-bone analog techno bliss?
          Look no further. Naughty tech grooves? They've got you covered.
        </p>

        <p>
          Carlina Carpelan is a Helsinki-based DJ deeply rooted in Finland’s underground dance music scene,
          active for years within the local club circuit.
        </p>

        <p>
          Carlina has built a strong reputation for delivering high-energy sets that thrive on rhythm,
          drive and raw physicality. Their sound explores the leftmost fields of electronic music:
          analog-leaning, percussive and groove-focused, with a sharp ear for tension and release.
        </p>

        <p>
          Carlina’s sets are immersive journeys guided by instinct, flow and a clear connection to the dance floor.
          Whether playing outdoor festival stages or sweaty late-morning basement hours,
          they bring an unmistakable intensity and momentum to every slot.
        </p>

        <p>
          In recent years, Carlina has shared booths with international names such as
          DJ Stingray, Wata Igarashi, Luke Slater and Jane Fitz,
          while also taking their sound beyond Finland to booths abroad.
        </p>

      </div>

    </section>

    <section id="photos">

      <h2>Promo Photos</h2>

      <div class="photo-grid">

        <img src="promo4.jpeg" alt="Promo photo 4">
        <img src="promo3.jpg" alt="Promo photo 3">
        <img src="promo1-websafe.jpg" alt="Promo photo 1">
        <img src="promo2.jpg" alt="Promo photo 2">
        <img src="promo8-websafe.jpg" alt="Promo photo 8">
        <img src="promo7.jpg" alt="Promo photo 7">

      </div>

    </section>

    <section id="soundcloud">

      <h2>SoundCloud</h2>

      <div class="soundcloud">

        <iframe
          height="166"
          scrolling="no"
          allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/carlina-carpelan/hosselimix&color=%2300a6ff&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&visual=false">
        </iframe>

        <iframe
          height="166"
          scrolling="no"
          allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/elektorni/elektorniguestmix014-carlina-carpelan&color=%2300a6ff&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&visual=false">
        </iframe>

        <iframe
          height="166"
          scrolling="no"
          allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/naastelkaar-event/naastelkaar-mix-carlina-carpelan&color=%2300a6ff&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&visual=false">
        </iframe>

        <iframe
          height="166"
          scrolling="no"
          allow="autoplay"
          src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/nollanolla-collective/puffcast-031-carlina-carpelan&color=%2300a6ff&auto_play=false&hide_related=false&show_comments=false&show_user=true&show_reposts=false&visual=false">
        </iframe>

      </div>

    </section>

    <section id="videos">

      <h2>Videos</h2>

      <div class="video-grid">

        <iframe
          src="https://www.youtube.com/embed/wS99neblvKQ"
          title="Carlina Carpelan"
          allowfullscreen>
        </iframe>

        <iframe
          src="https://www.youtube.com/embed/i5eY34kWcso"
          title="Diffractive Radio"
          allowfullscreen>
        </iframe>

        <iframe
          src="https://www.youtube.com/embed/GdHF_Qa-MdU"
          title="mini."
          allowfullscreen>
        </iframe>

        <iframe
          src="https://www.youtube.com/embed/BkqUtkkKx5c"
          title="Pearl Rush"
          allowfullscreen>
        </iframe>

      </div>

    </section>

    <section id="bookings">

      <h2>Bookings</h2>

      <div class="booking-box">

        <p>
          Direct contact:
        </p>

        <a
          class="booking-email"
          href="mailto:contact@carlinacarpelan.com">
          contact@carlinacarpelan.com
        </a>

        <p>
          Agency:
        </p>

        <a
          class="booking-email"
          href="https://signaturedark.fi/agency/"
          target="_blank">
          Signature Dark
        </a>

      </div>

    </section>

    <footer>
      Carlina Carpelan
    </footer>

  </div>

</body>

</html>
