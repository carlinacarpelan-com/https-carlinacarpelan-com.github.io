<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      font-family: 'Alata', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      display: flex;
      background: var(--blue);
    }

    .hero-text {
      width: 50%;
      height: 100vh;
      position: relative;
      background: var(--blue);
      padding-bottom: 180px;
    }

    .logo {
      position: absolute;
      left: 70px;
      top: 50%;
      transform: translateY(-58%);
      width: 320px;
      z-index: 2;
    }

    .logo img {
      width: 100%;
      display: block;
    }

    .menu {
      position: absolute;
      left: 72px;
      top: calc(50% + 55px);
      z-index: 9999;
    }

    .menu-toggle {
      display: none;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-button img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    .dropdown {
      position: absolute;
      top: 52px;
      left: 0;
      width: 280px;
      background: var(--black);
      border-radius: 22px;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        visibility 0.2s ease;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 18px 26px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown,
    .menu:focus-within .dropdown,
    .menu-toggle:checked ~ .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .hero-image {
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .hero {
        flex-direction: column;
        height: auto;
      }

      .hero-text {
        width: 100%;
        min-height: 65vh;
        padding-bottom: 220px;
      }

      .logo {
        left: 32px;
        width: 240px;
        top: 42%;
      }

      .menu {
        left: 34px;
        top: calc(42% + 95px);
      }

      .dropdown {
        width: 240px;
      }

      .hero-image {
        width: 100%;
        height: 45vh;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="logo">
          <img src="handwritten.png" alt="Carlina Carpelan">
        </div>

        <nav class="menu">

          <input class="menu-toggle" type="checkbox" id="menu-toggle">

          <label class="menu-button" for="menu-toggle">
            <img src="spiral.png" alt="Menu">
          </label>

          <div class="dropdown">
            <a href="index.html">Home</a>
            <a href="dj.html">DJ</a>
            <a href="events.html">Events</a>
            <a href="activism-and-voluntary.html">Activism & Voluntary</a>
            <a href="contact.html">Contact</a>
          </div>

        </nav>

      </div>

      <div class="hero-image">
        <img src="promo7.jpg" alt="Carlina Carpelan">
      </div>

    </header>

  </div>

</body>

</html>
