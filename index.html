<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--blue);
      font-family: 'Alata', sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      background: var(--blue);
    }

    /* =========================
       DESKTOP LAYOUT
       ========================= */

    .hero-text {
      width: 50%;
      min-height: 100vh;
      position: relative;
      background: var(--blue);
      overflow: visible;
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 43%;
      transform: translateY(-50%);
      width: 430px;
      max-width: calc(100% - 140px);
      z-index: 2;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }


    /* =========================
       MENU
       ========================= */

    .menu {
      position: absolute;
      left: 92px;
      top: calc(43% + 12px);
      width: 320px;
      height: 380px;
      z-index: 9999;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      transition: transform 0.6s ease;
    }

    .menu-button:hover img {
      transform: rotate(360deg);
    }


    /* =========================
       MAIN DROPDOWN
       ========================= */

    .dropdown {
      position: absolute;
      top: 58px;
      left: 0;
      width: 300px;
      background: var(--black);
      border-radius: 22px;
      display: none;
      overflow: hidden;
      padding: 8px 0 16px;
      box-shadow: 0 14px 45px rgba(0,0,0,0.3);
    }

    .menu:hover .dropdown,
    .menu:focus-within .dropdown {
      display: block;
    }


    /* =========================
       NORMAL MENU LINKS
       ========================= */

    .dropdown > a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255,255,255,0.08);

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown > a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .dropdown > a:last-child {
      border-bottom: none;
    }


    /* =========================
       DJ + GIGS
       ========================= */

    .dj-menu {
      position: relative;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .dj-row {
      display: flex;
      align-items: stretch;
      width: 100%;
    }

    .dj-link {
      flex: 1;
      display: flex;
      align-items: center;

      color: var(--blue);
      text-decoration: none;

      padding: 17px 24px;

      font-size: 17px;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dj-link:hover {
      background: var(--blue);
      color: var(--black);
    }


    /* DJ arrow */

    .submenu-toggle {
      width: 55px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: none;

      background: transparent;
      color: var(--blue);

      font-family: 'Alata', sans-serif;
      font-size: 22px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .submenu-toggle:hover {
      background: var(--blue);
      color: var(--black);
    }

    .submenu-toggle span {
      display: inline-block;
      transition: transform 0.25s ease;
    }

    .dj-menu:hover .submenu-toggle span,
    .dj-menu.open .submenu-toggle span {
      transform: rotate(90deg);
    }


    /* =========================
       GIGS SUBMENU
       ========================= */

    .submenu {
      display: none;
      width: 100%;
      background: #111111;
    }

    /* Desktop: show Gigs when hovering DJ */

    .dj-menu:hover .submenu {
      display: block;
    }

    /* Mobile / keyboard */

    .dj-menu.open .submenu,
    .dj-menu:focus-within .submenu {
      display: block;
    }

    .submenu a {
      display: block;

      color: var(--blue);
      text-decoration: none;

      padding: 14px 24px 14px 46px;

      font-size: 15px;

      border-top: 1px solid rgba(255,255,255,0.08);

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .submenu a:hover {
      background: var(--blue);
      color: var(--black);
    }


    /* =========================
       HERO IMAGE
       ========================= */

    .hero-image {
      width: 50%;
      min-height: 100vh;
      overflow: hidden;
      background: var(--blue);
    }

    .hero-image img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 900px) {

      .hero {
        flex-direction: column;
        min-height: 100vh;
      }

      .hero-text {
        width: 100%;
        min-height: 18vh;

        padding:
          28px
          22px
          8px;

        display: flex;
        align-items: center;
        justify-content: center;
      }


      /* MOBILE: LOGO + SPIRAL SIDE BY SIDE */

      .mobile-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        position: static;
        transform: none;
        width: 270px;
        max-width: 72vw;
      }

      .menu {
        position: relative;
        left: auto;
        top: auto;
        width: 58px;
        height: 58px;
      }

      .menu-button {
        width: 58px;
        height: 58px;
      }

      .menu-button img {
        width: 48px;
        height: 48px;
      }

      .dropdown {
        width: 248px;
      }

      .dropdown > a {
        font-size: 15px;
        padding: 14px 18px;
      }

      .dj-link {
        font-size: 15px;
        padding: 14px 18px;
      }

      .submenu-toggle {
        width: 48px;
        font-size: 20px;
      }

      .submenu a {
        font-size: 14px;
        padding: 13px 18px 13px 36px;
      }

      .hero-image {
        width: 100%;
        min-height: 82vh;
      }

      .hero-image img {
        width: 100%;
        height: 82vh;
        object-fit: cover;
      }

    }

  </style>

</head>


<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="mobile-brand">


          <!-- MENU -->

          <nav class="menu">

            <button
              class="menu-button"
              type="button"
              aria-label="Menu"
            >
              <img src="spiral.png" alt="Menu">
            </button>


            <!-- DROPDOWN -->

            <div class="dropdown">


              <!-- HOME -->

              <a href="index.html">
                Home
              </a>


              <!-- =========================
                   DJ + GIGS SUBMENU
                   ========================= -->

              <div class="dj-menu">

                <div class="dj-row">

                  <a
                    href="dj.html"
                    class="dj-link"
                  >
                    DJ
                  </a>

                  <button
                    class="submenu-toggle"
                    type="button"
                    aria-label="Open Gigs submenu"
                    aria-expanded="false"
                  >
                    <span>›</span>
                  </button>

                </div>


                <!-- GIGS -->

                <div class="submenu">

                  <a href="gigs.html">
                    Gigs
                  </a>

                </div>

              </div>


              <!-- EVENTS -->

              <a href="events.html">
                Events
              </a>


              <!-- CONTACT -->

              <a href="contact.html">
                Contact
              </a>


            </div>

          </nav>


          <!-- LOGO -->

          <div class="logo">

            <img
              src="handwritten.png"
              alt="Carlina Carpelan"
            >

          </div>

        </div>

      </div>


      <!-- RIGHT SIDE IMAGE -->

      <div class="hero-image">

        <img
          src="promo7.jpg"
          alt="Carlina Carpelan"
        >

      </div>

    </header>

  </div>


  <!-- =========================
       GIGS SUBMENU SCRIPT
       ========================= -->

  <script>

    const submenuToggle = document.querySelector('.submenu-toggle');
    const djMenu = document.querySelector('.dj-menu');

    submenuToggle.addEventListener('click', function(event) {

      event.preventDefault();
      event.stopPropagation();

      djMenu.classList.toggle('open');

      const isOpen = djMenu.classList.contains('open');

      submenuToggle.setAttribute(
        'aria-expanded',
        isOpen
      );

    });

  </script>

</body>

</html>
