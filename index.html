<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: 'Alata', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background: var(--blue);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .hero-text {
      padding: 48px 40px;
      width: 50%;
      z-index: 2;
    }

    .hero-image {
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
      transition:
        filter 0.3s ease,
        transform 0.3s ease;
    }

    .hero-image img:hover {
      filter: grayscale(0%);
      transform: scale(1.02);
    }

    h1 {
      font-size: clamp(82px, 13vw, 190px);
      line-height: 0.82;
      margin: 0;
      font-weight: 400;
      letter-spacing: -0.08em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 42px;
    }

    .links a {
      color: var(--black);
      border: 1.5px solid var(--black);
      border-radius: 999px;
      padding: 10px 22px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 400;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .links a:hover {
      background: var(--black);
      color: var(--blue);
      transform: translateY(-2px);
    }

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .hero {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .hero-text {
        width: 100%;
        padding: 40px 24px;
      }

      .hero-image {
        width: 100%;
        height: 50vh;
      }

      h1 {
        font-size: clamp(64px, 18vw, 120px);
      }

      .links {
        gap: 12px;
      }

      .links a {
        font-size: 16px;
        padding: 10px 18px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <h1>
          Carlina<br>
          Carpelan
        </h1>

        <div class="links">

          <a href="dj.html">
            DJ
          </a>

          <a href="events.html">
            Events
          </a>

          <a href="activism-and-voluntary.html">
            Activism & Voluntary
          </a>

          <a href="contact.html">
            Contact
          </a>

        </div>

      </div>

      <div class="hero-image">

        <img src="promo7.jpg" alt="Carlina Carpelan">

      </div>

    </header>

  </div>

</body>

</html>
