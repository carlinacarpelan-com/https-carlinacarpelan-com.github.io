<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>

    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--blue);
      font-family: 'Alata', sans-serif;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      background: var(--blue);
    }

    .hero-text {
      width: 50%;
      min-height: 100vh;
      position: relative;
      background: var(--blue);
      overflow: visible;
      z-index: 2;
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 43%;
      transform: translateY(-50%);
      width: 430px;
      max-width: calc(100% - 140px);
      z-index: 2;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .menu {
      position: absolute;
      left: 92px;
      top: calc(43% + 18px);
      width: 320px;
      height: 420px;
      z-index: 9999;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    .dropdown {
      position: absolute;
      top: 52px;
      left: 0;
      width: 300px;
      background: var(--black);
      border-radius: 22px;
      display: none;
      z-index: 10000;
      overflow: hidden;
      padding: 8px 0 16px;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.3);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown {
      display: block;
    }

    .hero-image {
      width: 50%;
      min-height: 100vh;
      overflow: hidden;
      background: var(--blue);
    }

    .hero-image img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 900px) {

      .hero {
        flex-direction: column;
        min-height: auto;
      }

      .hero-text {
        width: 100%;
        min-height: 28vh;
      }

      .logo {
        left: 50%;
        top: 28%;
        transform: translate(-50%, -50%);
        width: 260px;
        max-width: 72%;
      }

      .menu {
        left: 50%;
        transform: translateX(-50%);
        top: calc(28% + 52px);
        width: 260px;
        height: 260px;
      }

      .menu-button {
        width: 52px;
        height: 52px;
      }

      .menu-button img {
        width: 42px;
        height: 42px;
      }

      .dropdown {
        width: 250px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 14px 18px;
      }

      .hero-image {
        width: 100%;
        min-height: 72vh;
      }

      .hero-image img {
        width: 100%;
        height: 72vh;
        object-fit: cover;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="logo">
          <img src="handwritten.png" alt="Carlina Carpelan">
        </div>

        <nav class="menu">

          <button class="menu-button" type="button">
            <img src="spiral.png" alt="Menu">
          </button>

          <div class="dropdown">

            <a href="index.html">
              Home
            </a>

            <a href="dj.html">
              DJ
            </a>

            <a href="events.html">
              Events
            </a>

            <a href="activism-and-voluntary.html">
              Activism & Voluntary
            </a>

            <a href="contact.html">
              Contact
            </a>

          </div>

        </nav>

      </div>

      <div class="hero-image">

        <img src="promo7.jpg" alt="Carlina Carpelan">

      </div>

    </header>

  </div>

</body>

</html>
