<style>

.photo-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  margin-top: 40px;
  margin-bottom: 80px;
}

.photo-grid img {
  width: 100%;
  height: 700px;
  object-fit: cover;
  display: block;
}

/* mobiili */

@media (max-width: 900px) {

  .photo-grid {
    grid-template-columns: 1fr;
  }

  .photo-grid img {
    height: auto;
  }

}

</style>


<h2>Promo Photos</h2>

<div class="photo-grid">

  <img src="promo1-websafe.jpg" alt="Promo photo 1">

  <img src="promo2.jpg" alt="Promo photo 2">

</div>
