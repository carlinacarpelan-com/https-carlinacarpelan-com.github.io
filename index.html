<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      background: #ffffff;
      color: #111111;
    }

    h1, h2 {
      margin-top: 40px;
    }

    img {
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
      border-radius: 12px;
    }

    a {
      color: #000;
      font-weight: bold;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    iframe {
      margin-top: 20px;
      margin-bottom: 40px;
      border-radius: 12px;
    }

    .links a {
      display: inline-block;
      margin-right: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <h1>Carlina Carpelan</h1>

  <p>
    DJ / Event Producer / Activist
  </p>

  <p>
    Carlina Carpelan is a Helsinki-based DJ, event producer and activist.
    Her sets blend emotional electronic music, underground club sounds and high-energy dance music.
  </p>

  <div class="links">
    <a href="https://soundcloud.com/carlina-carpelan" target="_blank">
      SoundCloud
    </a>

    <a href="https://www.youtube.com/watch?v=wS99neblvKQ" target="_blank">
      YouTube
    </a>
  </div>

  <h2>Artist Photos</h2>

  <img src="https://via.placeholder.com/700x450" alt="Carlina Carpelan DJ photo">

  <iframe
    width="100%"
    height="166"
    scrolling="no"
    frameborder="no"
    allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/carlina-carpelan">
  </iframe>

  <h2>Videos</h2>

  <iframe
    width="100%"
    height="500"
    src="https://www.youtube.com/embed/wS99neblvKQ"

    allowfullscreen>

</html>
