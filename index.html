<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: 'Alata', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background: var(--blue);
      color: var(--black);
      display: flex;
      align-items: stretch;
      overflow: visible;
    }

    .hero-text {
      width: 50%;
      height: 100vh;
      padding: 32px 36px;
      position: relative;
      overflow: visible;
    }

    .logo {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      max-width: 520px;
      pointer-events: none;
      z-index: 1;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .menu {
      position: absolute;
      left: 54px;
      top: calc(50% + 105px);
      width: fit-content;
      z-index: 9999;
    }

    .menu-toggle {
      display: none;
    }

    .menu-button {
      display: block;
      width: 54px;
      height: 54px;
      cursor: pointer;
    }

    .menu-button img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
    }

    .dropdown {
      position: absolute;
      top: 0;
      left: 54px;
      background: var(--black);
      border-radius: 18px;
      min-width: 270px;
      overflow: hidden;
      display: none;
      z-index: 10000;
      padding-bottom: 14px;
    }

    .dropdown a {
      display: block;
      padding: 15px 22px;
      color: var(--blue);
      text-decoration: none;
      font-size: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
    }

    .dropdown a:last-child {
      border-bottom: none;
      margin-bottom: 8px;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown,
    .menu:focus-within .dropdown,
    .menu-toggle:checked ~ .dropdown {
      display: block;
    }

    .hero-image {
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .hero {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .hero-text {
        width: 100%;
        height: 54vh;
        min-height: 420px;
        padding: 28px 20px;
      }

      .logo {
        left: 20px;
        max-width: 340px;
      }

      .menu {
        left: 34px;
        top: calc(50% + 72px);
      }

      .menu-button,
      .menu-button img {
        width: 46px;
        height: 46px;
      }

      .dropdown {
        left: 46px;
        min-width: 230px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 14px 18px;
      }

      .hero-image {
        width: 100%;
        height: 46vh;
      }

    }
  </style>
</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="logo">
          <img src="handwritten.png" alt="Carlina Carpelan">
        </div>

        <nav class="menu">

          <input class="menu-toggle" type="checkbox" id="menu-toggle">

          <label class="menu-button" for="menu-toggle">
            <img src="spiral.png" alt="Menu">
          </label>

          <div class="dropdown">

            <a href="index.html">Home</a>
            <a href="dj.html">DJ</a>
            <a href="events.html">Events</a>
            <a href="activism-and-voluntary.html">Activism & Voluntary</a>
            <a href="contact.html">Contact</a>

          </div>

        </nav>

      </div>

      <div class="hero-image">
        <img src="promo7.jpg" alt="Carlina Carpelan">
      </div>

    </header>

  </div>

</body>

</html>
