<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--black);
      color: var(--white);
      font-family: 'Alata', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      background: var(--blue);
      color: var(--black);
      display: flex;
      align-items: stretch;
    }

    .hero-text {
      width: 50%;
      padding: 40px 40px 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .logo {
      width: 100%;
      max-width: 520px;
      margin-bottom: 36px;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .menu {
      position: relative;
      width: fit-content;
      margin-left: 8px;
      margin-top: 10px;
      z-index: 9999;
    }

    .menu-toggle {
      display: none;
    }

    .menu-button {
      display: block;
      width: 54px;
      height: 54px;
      cursor: pointer;
    }

    .menu-button img {
      width: 54px;
      height: 54px;
      object-fit: contain;
      display: block;
    }

    .dropdown {
      position: absolute;
      top: 72px;
      left: 0;
      background: var(--black);
      border-radius: 22px;
      min-width: 270px;
      overflow: hidden;
      display: none;
      z-index: 10000;
      padding-bottom: 24px;
    }

    .dropdown a {
      display: block;
      padding: 16px 22px;
      color: var(--blue);
      text-decoration: none;
      font-size: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
      margin-bottom: 10px;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown,
    .menu:focus-within .dropdown,
    .menu-toggle:checked ~ .dropdown {
      display: block;
    }

    .hero-image {
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 900px) {

      body {
        overflow: auto;
      }

      .hero {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .hero-text {
        width: 100%;
        padding: 30px 24px 120px;
      }

      .logo {
        max-width: 340px;
        margin-bottom: 28px;
      }

      .menu-button,
      .menu-button img {
        width: 46px;
        height: 46px;
      }

      .dropdown {
        top: 62px;
        min-width: 230px;
        padding-bottom: 18px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 14px 18px;
      }

      .hero-image {
        width: 100%;
        height: 46vh;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="logo">
          <img src="handwritten.png" alt="Carlina Carpelan">
        </div>

        <nav class="menu">

          <input class="menu-toggle" type="checkbox" id="menu-toggle">

          <label class="menu-button" for="menu-toggle">
            <img src="spiral.png" alt="Menu">
          </label>

          <div class="dropdown">

            <a href="index.html">
              Home
            </a>

            <a href="dj.html">
              DJ
            </a>

            <a href="events.html">
              Events
            </a>

            <a href="activism-and-voluntary.html">
              Activism & Voluntary
            </a>

            <a href="contact.html">
              Contact
            </a>

          </div>

        </nav>

      </div>

      <div class="hero-image">
        <img src="promo7.jpg" alt="Carlina Carpelan">
      </div>

    </header>

  </div>

</body>

</html>
