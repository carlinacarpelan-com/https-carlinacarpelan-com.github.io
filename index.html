<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--blue);
      font-family: 'Alata', sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
    }

    .hero {
      width: 100%;
      height: 100vh;
      display: flex;
      background: var(--blue);
    }

    .hero-text {
      width: 50%;
      height: 100vh;
      position: relative;
      overflow: visible;
      background: var(--blue);
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 43%;
      transform: translateY(-50%);
      width: 430px;
      max-width: calc(100% - 140px);
      z-index: 1;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .menu {
      position: absolute;
      left: 92px;
      top: calc(43% + 115px);
      width: fit-content;
      z-index: 9999;
    }

    .menu-toggle {
      display: none;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    .dropdown {
      position: absolute;
      top: 66px;
      left: 0;
      width: 300px;
      max-height: calc(100vh - 250px);
      overflow-y: auto;
      background: var(--black);
      border-radius: 22px;
      display: none;
      z-index: 10000;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.3);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    .dropdown a:last-child {
      border-bottom: none;
      margin-bottom: 18px;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown,
    .menu:focus-within .dropdown,
    .menu-toggle:checked ~ .dropdown {
      display: block;
    }

    .hero-image {
      width: 50%;
      height: 100vh;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .hero {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
      }

      .hero-text {
        width: 100%;
        height: 62vh;
        min-height: 520px;
      }

      .logo {
        left: 32px;
        top: 36%;
        width: 300px;
        max-width: calc(100% - 64px);
      }

      .menu {
        left: 32px;
        top: calc(36% + 92px);
      }

      .menu-button {
        width: 56px;
        height: 56px;
      }

      .menu-button img {
        width: 46px;
        height: 46px;
      }

      .dropdown {
        top: 60px;
        width: 260px;
        max-height: 300px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 15px 20px;
      }

      .hero-image {
        width: 100%;
        height: 46vh;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="logo">
          <img src="handwritten.png" alt="Carlina Carpelan">
        </div>

        <nav class="menu">

          <input class="menu-toggle" type="checkbox" id="menu-toggle">

          <label class="menu-button" for="menu-toggle">
            <img src="spiral.png" alt="Menu">
          </label>

          <div class="dropdown">
            <a href="index.html">Home</a>
            <a href="dj.html">DJ</a>
            <a href="events.html">Events</a>
            <a href="activism-and-voluntary.html">Activism & Voluntary</a>
            <a href="contact.html">Contact</a>
          </div>

        </nav>

      </div>

      <div class="hero-image">
        <img src="promo7.jpg" alt="Carlina Carpelan">
      </div>

    </header>

  </div>

</body>

</html>
