<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Carlina Carpelan</title>

  <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --blue: #A6C3CE;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--blue);
      font-family: 'Alata', sans-serif;
      overflow: auto;
    }

    .container {
      width: 100%;
      min-height: 100vh;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      background: var(--blue);
    }

    .hero-text {
      width: 50%;
      min-height: 100vh;
      position: relative;
      background: var(--blue);
      padding: 40px;
      overflow: visible;
      z-index: 2;
    }

    .logo {
      position: absolute;
      left: 92px;
      top: 43%;
      transform: translateY(-50%);
      width: 430px;
      max-width: calc(100% - 140px);
      z-index: 2;
      pointer-events: none;
    }

    .logo img {
      width: 100%;
      height: auto;
      display: block;
    }

    .menu {
      position: absolute;
      left: 92px;
      top: calc(43% + 45px);
      width: 320px;
      height: 420px;
      z-index: 9999;
    }

    .menu-button {
      width: 62px;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }

    .menu-button img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    .dropdown {
      position: absolute;
      top: 52px;
      left: 0;
      width: 300px;
      background: var(--black);
      border-radius: 22px;
      display: none;
      z-index: 10000;
      overflow: hidden;
      padding: 8px 0 22px;
      box-shadow: 0 14px 45px rgba(0, 0, 0, 0.3);
    }

    .dropdown a {
      display: block;
      color: var(--blue);
      text-decoration: none;
      padding: 17px 24px;
      font-size: 17px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .dropdown a:last-child {
      border-bottom: none;
    }

    .dropdown a:hover {
      background: var(--blue);
      color: var(--black);
    }

    .menu:hover .dropdown {
      display: block;
    }

    .hero-image {
      width: 50%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .hero-image img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* LEFT EDGE FADE */
    .hero-image::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 32%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          to right,
          var(--blue) 0%,
          rgba(166,195,206,0.96) 12%,
          rgba(166,195,206,0.82) 22%,
          rgba(166,195,206,0.58) 38%,
          rgba(166,195,206,0.28) 58%,
          rgba(166,195,206,0.08) 78%,
          rgba(166,195,206,0) 100%
        );
    }

    /* TOP/BOTTOM SOFTENING */
    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(166,195,206,0.22) 0%,
          rgba(166,195,206,0) 12%,
          rgba(166,195,206,0) 88%,
          rgba(166,195,206,0.18) 100%
        );
    }

    @media (max-width: 900px) {

      .hero {
        flex-direction: column;
      }

      .hero-text {
        width: 100%;
        min-height: 640px;
        padding: 32px 24px;
      }

      .logo {
        left: 32px;
        top: 34%;
        width: 300px;
        max-width: calc(100% - 64px);
      }

      .menu {
        left: 32px;
        top: calc(34% + 75px);
        width: 280px;
        height: 380px;
      }

      .menu-button {
        width: 56px;
        height: 56px;
      }

      .menu-button img {
        width: 46px;
        height: 46px;
      }

      .dropdown {
        width: 260px;
      }

      .dropdown a {
        font-size: 15px;
        padding: 15px 20px;
      }

      .hero-image {
        width: 100%;
        min-height: 46vh;
      }

      .hero-image img {
        height: 46vh;
      }

      .hero-image::before {
        width: 100%;
        height: 30%;
        background:
          linear-gradient(
            to bottom,
            var(--blue) 0%,
            rgba(166,195,206,0.92) 18%,
            rgba(166,195,206,0.58) 46%,
            rgba(166,195,206,0) 100%
          );
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="hero-text">

        <div class="logo">
          <img src="handwritten.png" alt="Carlina Carpelan">
        </div>

        <nav class="menu">

          <button class="menu-button" type="button">
            <img src="spiral.png" alt="Menu">
          </button>

          <div class="dropdown">

            <a href="index.html">
              Home
            </a>

            <a href="dj.html">
              DJ
            </a>

            <a href="events.html">
              Events
            </a>

            <a href="activism-and-voluntary.html">
              Activism & Voluntary
            </a>

            <a href="contact.html">
              Contact
            </a>

          </div>

        </nav>

      </div>

      <div class="hero-image">

        <img src="promo7.jpg" alt="Carlina Carpelan">

      </div>

    </header>

  </div>

</body>

</html>
